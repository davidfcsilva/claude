# ── Grafana Observability Stack ────────────────────────────────────────────────
# Standalone Grafana Deployment with PVC for persistence.
# Pre-configured with Prometheus as the default datasource.
#
# Resources:
#   Secret                                               → admin credentials
#   ConfigMap (datasources)                              → pre-wired Prometheus datasource
#   ConfigMap (dashboards)                               → dashboard provisioning config
#   Deployment                                           → grafana/grafana-oss:11.2.0
#   PersistentVolumeClaim                                → 5Gi local-path for data
#   Service                                              → LoadBalancer 3000 (MetalLB external IP)

apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: "15s"
          httpMethod: POST
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: Prometheus

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: "default"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: monitoring
    spec:
      securityContext:
        runAsUser: 472       # grafana user
        runAsNonRoot: true
        fsGroup: 472
      terminationGracePeriodSeconds: 30
      initContainers:
        # Create the dashboards directory so provisioning doesn't error-loop on startup.
        - name: init-dashboards
          image: docker.io/grafana/grafana-oss:11.2.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /var/lib/grafana/dashboards"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: docker.io/grafana/grafana-oss:11.2.0
          imagePullPolicy: IfNotPresent
          env:
            # Admin credentials from Secret.
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            # Disable Grafana analytics / cloud sharing telemetry.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATE_STATE
              value: "disable"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_updates
              value: "disable"
            # Disable signup prompts and default hostname.
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost:3000"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "false"
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Datasource provisioning.
            - name: datasources-volume
              mountPath: /etc/grafana/provisioning/datasources
            # Dashboard provisioning config.
            - name: dashboards-volume
              mountPath: /etc/grafana/provisioning/dashboards
            # Persistent storage for database, plugins, and uploaded dashboards.
            - name: grafana-data
              mountPath: /var/lib/grafana
            # Writable temp directories (readOnlyRootFilesystem = true).
            - name: grafana-tmp
              mountPath: /tmp
            - name: grafana-cache
              mountPath: /var/cache/grafana
            - name: grafana-logs
              mountPath: /var/log/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datasources-volume
          configMap:
            name: grafana-datasources
        - name: dashboards-volume
          configMap:
            name: grafana-dashboards
        - name: grafana-tmp
          emptyDir: {}
        - name: grafana-cache
          emptyDir: {}
        - name: grafana-logs
          emptyDir: {}
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
