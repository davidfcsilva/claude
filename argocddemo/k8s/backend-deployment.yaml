apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: argocddemo
  labels:
    app.kubernetes.io/name: argocddemo
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: argocddemo
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocddemo
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: fastapi
          image: docker.io/library/python:3.12-slim
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - pip install --quiet fastapi==0.115.6 uvicorn==0.34.0 && exec uvicorn main:app --host 0.0.0.0 --port 8000
          workingDir: /app
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: app-code
              mountPath: /app/main.py
              subPath: main.py
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: app-code
          configMap:
            name: backend-app-config

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: argocddemo
  labels:
    app.kubernetes.io/name: argocddemo
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argocddemo
    app.kubernetes.io/component: backend
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
