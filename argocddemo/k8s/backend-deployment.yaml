apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: argocddemo
  labels:
    app.kubernetes.io/name: argocddemo
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: argocddemo
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocddemo
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: fastapi
          image: docker.io/python:3.12-slim
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: argocddemo
  labels:
    app.kubernetes.io/name: argocddemo
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argocddemo
    app.kubernetes.io/component: backend
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
