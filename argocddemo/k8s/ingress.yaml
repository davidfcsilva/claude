apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocddemo-ingress
  namespace: argocddemo
  labels:
    app.kubernetes.io/name: argocddemo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: argocddemo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
