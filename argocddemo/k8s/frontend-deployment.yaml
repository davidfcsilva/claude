apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: argocddemo
  labels:
    app.kubernetes.io/name: argocddemo
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: argocddemo
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/nginx-static: "a1b2c3d4"  # bump this to force rollout when static content changes
      labels:
        app.kubernetes.io/name: argocddemo
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-static-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config
        - name: nginx-static-volume
          configMap:
            name: nginx-static
