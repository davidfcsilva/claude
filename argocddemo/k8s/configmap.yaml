          <circle cx="96" cy="257" r="2" fill="rgba(255,255,255,0.5)"/>
          <circle class="ornament o1" cx="130" cy="240" r="8" fill="#ffd700"/>
          <circle cx="128" cy="237" r="2" fill="rgba(255,255,255,0.5)"/>

          <!-- Blue ornaments (4) -->
          <circle class="ornament o3" cx="115" cy="165" r="8" fill="#4a90d9"/>
          <circle cx="113" cy="162" r="2" fill="rgba(255,255,255,0.5)"/>
