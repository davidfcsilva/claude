          <!-- Golden star topper -->
          <polygon class="star-topper"
            points="110,8 113,22 127,22 116,30 120,44 110,36 100,44 104,30 93,22 107,22"
            fill="#ffd700"/>
          <circle cx="110" cy="26" r="18" fill="url(#starGlow)" opacity="0.5"/>
        </svg>
      </div>

      <h1 class="title">ARGOCD DEMO</h1>

      <div class="console">
        <div><span class="label">&gt; TREE STATUS:</span> <span class="ok">ALL ORNAMENTS IN PLACE</span></div>
        <div><span class="label">&gt; ORNAMENTS SYNCED:</span>   <span class="val">5 / 5</span></div>
        <div><span class="label">&gt; GARLAND:</span>            <span class="ok">illuminated</span> <span style="color:#ffd700">&#10024;</span></div>
        <div><span class="label">&gt; LAST DECOR:</span>         <span class="val">just now</span> <span style="color:#66d9a8">&#127800;</span></div>
