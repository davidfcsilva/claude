apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: argocddemo
data:
  VITE_API_URL: "http://frontend.argocddemo.svc.cluster.local"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: argocddemo
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend.argocddemo.svc.cluster.local:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend.argocddemo.svc.cluster.local:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-app-config
  namespace: argocddemo
data:
  main.py: |
    """Demo backend using FastAPI."""

    from fastapi import FastAPI

    app = FastAPI(title="ArgoCD Demo Backend", version="0.1.0")


    @app.get("/health")
    async def health() -> dict:
        """Health check endpoint."""
        return {"status": "healthy", "version": "0.1.0"}


    @app.get("/api/items")
    async def get_items() -> list[dict]:
        """Return a demo list of items."""
        return [
            {"id": 1, "name": "Widget A"},
            {"id": 2, "name": "Widget B"},
            {"id": 3, "name": "Widget C"},
        ]


    @app.get("/")
    async def root() -> dict:
        """Root endpoint — simple greeting."""
        return {"message": "Hello from the ArgoCD demo backend!"}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-static
  namespace: argocddemo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ArgoCD Demo</title>
        <style>
          body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
          }
          h1 { color: #333; margin-bottom: 24px; }
          img { max-width: 512px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
        </style>
    </head>
    <body>
        <h1>Welcome to ArgoCD Demo</h1>
        <img src="https://placedog.net/500/400?rand=0" alt="A cute dog" />
    </body>
    </html>
