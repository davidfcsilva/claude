apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: argocddemo
data:
  VITE_API_URL: "http://frontend.argocddemo.svc.cluster.local"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: argocddemo
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend.argocddemo.svc.cluster.local:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend.argocddemo.svc.cluster.local:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
