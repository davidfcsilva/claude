          <!-- Middle tier foliage -->
          <path d="M110 95 L62 230 L158 230Z" fill="#147a4a"/>
          <path d="M110 95 L86 230 L110 230Z" fill="rgba(255,255,255,0.06)"/>

          <!-- Top tier foliage -->
          <path d="M110 40 L75 175 L145 175Z" fill="#1a5c3a"/>
          <path d="M110 40 L92 175 L110 175Z" fill="rgba(255,255,255,0.06)"/>

          <!-- Gold garland dots (zigzag ~12 dots) -->
          <circle class="garland-dot" cx="95" cy="170" r="2.5" fill="#ffd700" opacity="0.8"/>
          <circle class="garland-dot" cx="125" cy="185" r="2.5" fill="#ffd700" opacity="0.8"/>
          <circle class="garland-dot" cx="82" cy="205" r="2.5" fill="#ffd700" opacity="0.8"/>
