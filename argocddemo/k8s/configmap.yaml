apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: argocddemo
data:
  VITE_API_URL: "http://frontend.argocddemo.svc.cluster.local"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: argocddemo
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend.argocddemo.svc.cluster.local:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend.argocddemo.svc.cluster.local:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-app-config
  namespace: argocddemo
data:
  main.py: |
    """Demo backend using FastAPI."""

    from fastapi import FastAPI

    app = FastAPI(title="ArgoCD Demo Backend", version="0.1.0")


    @app.get("/health")
    async def health() -> dict:
        """Health check endpoint."""
        return {"status": "healthy", "version": "0.1.0"}


    @app.get("/api/items")
    async def get_items() -> list[dict]:
        """Return a demo list of items."""
        return [
            {"id": 1, "name": "Widget A"},
            {"id": 2, "name": "Widget B"},
            {"id": 3, "name": "Widget C"},
        ]


    @app.get("/")
    async def root() -> dict:
        """Root endpoint — simple greeting."""
        return {"message": "Hello from the ArgoCD demo backend!"}

---
