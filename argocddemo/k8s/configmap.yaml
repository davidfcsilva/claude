apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-static
  namespace: argocddemo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ArgoCD Demo — Mission Control</title>
        <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }

          @keyframes twinkle {
            0%, 100% { opacity: 0.25; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
          }
          @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-18px); }
          }
          @keyframes flamePulse {
            0%, 100% { opacity: 1; transform: scaleY(1); }
            50% { opacity: 0.7; transform: scaleY(1.3); }
          }
          @keyframes smokeDrift {
            0% { opacity: 0; transform: translateY(0) scale(0.6); }
            40% { opacity: 0.55; }
            100% { opacity: 0; transform: translateY(60px) scale(1.5); }
          }

          body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(175deg, #0b0d17 0%, #161834 35%, #1e2250 65%, #0f1029 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: relative;
          }

          .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
          }

          .rocket-wrap {
            animation: float 3.4s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(78,205,196,0.25));
            z-index: 1;
          }

          .flame {
            transform-box: fill-box;
            transform-origin: top center;
            animation: flamePulse 0.3s ease-in-out infinite alternate;
          }
          .smoke-puff {
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
            animation: smokeDrift 2.4s ease-out infinite;
          }
          .smoke-puff.s2 { animation-delay: 0.6s; }
          .smoke-puff.s3 { animation-delay: 1.2s; }
          .smoke-puff.s4 { animation-delay: 1.8s; }

          .claude-logo {
            margin-top: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #7c85c4;
            font-size: 0.75rem;
            letter-spacing: 2px;
            z-index: 1;
          }
          .claude-logo svg { flex-shrink: 0; }

          .title {
            color: #e0e7ff;
            font-size: 2.6rem;
            margin-top: 8px;
            letter-spacing: 4px;
            text-shadow: 0 0 24px rgba(99,155,255,0.5), 0 0 60px rgba(99,155,255,0.2);
            z-index: 1;
          }

          .console {
            margin-top: 28px;
            padding: 20px 32px;
            background: rgba(7,9,23,0.85);
            border: 1px solid rgba(78,205,196,0.3);
            border-radius: 12px;
            color: #4ecdc4;
            font-size: 0.92rem;
            line-height: 1.7;
            z-index: 1;
            box-shadow: 0 0 40px rgba(78,205,196,0.08), inset 0 0 20px rgba(78,205,196,0.03);
            max-width: 540px;
          }
          .console .label { color: #7c85c4; }
          .console .ok    { color: #4ecdc4; font-weight: bold; }
          .console .val   { color: #e0e7ff; }
          .cursor-blink {
            animation: twinkle 1s step-end infinite;
            color: #4ecdc4;
          }
        </style>
    </head>
    <body>

      <!-- Starfield -->
      <script>
        for(let i=0;i<70;i++){
          const s=document.createElement('div');
          s.className='star';
          const size=Math.random()<0.15?3:Math.random()<0.4?2:1;
          s.style.cssText=`width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${1+Math.random()*2.5}s`;
          document.body.appendChild(s);
        }
      </script>

      <div class="rocket-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="280" height="460" viewBox="0 0 280 460">
          <!-- Smoke puffs -->
          <ellipse class="smoke-puff s1" cx="125" cy="400" rx="18" ry="12" fill="rgba(160,170,190,0.4)"/>
          <ellipse class="smoke-puff s2" cx="135" cy="395" rx="15" ry="10" fill="rgba(160,170,190,0.35)"/>
          <ellipse class="smoke-puff s3" cx="120" cy="405" rx="12" ry="8" fill="rgba(160,170,190,0.3)"/>
          <ellipse class="smoke-puff s4" cx="130" cy="390" rx="20" ry="14" fill="rgba(140,150,180,0.25)"/>

          <!-- Thrust cone (behind engine) -->
          <path class="flame" d="M100 370 C100 400 112 420 125 428 C138 420 150 400 150 370Z" fill="rgba(255,160,50,0.15)"/>

          <!-- Engine bells -->
          <path class="flame" d="M108 340 L98 365 C95 370 95 375 98 375 L102 375 C105 375 108 370 112 365 L112 340Z" fill="#6c7a89"/>
          <path class="flame" d="M138 340 L138 365 C142 370 145 375 148 375 L152 375 C155 375 155 370 152 365 L152 340Z" fill="#6c7a89"/>

          <!-- Main flames -->
          <path class="flame" d="M112 375 C112 395 118 415 125 420 C132 415 138 395 138 375Z" fill="#ff7b00"/>
          <path class="flame" d="M116 375 C116 390 120 408 125 412 C130 408 134 390 134 375Z" fill="#ffaa33"/>
          <path class="flame" d="M119 375 C119 386 122 400 125 403 C128 400 131 386 131 375Z" fill="#fff5d4"/>

          <!-- Stage 3 (upper stage) -->
          <rect x="110" y="30" width="60" height="40" rx="8" fill="#f0f2f5"/>
          <rect x="110" y="55" width="60" height="6" fill="#e07b39"/>
          <!-- S3 window -->
          <circle cx="140" cy="50" r="8" fill="#2d3561" stroke="#c4cad7" stroke-width="3"/>
          <circle cx="140" cy="50" r="5" fill="#5fa8d0" opacity="0.6"/>
          <!-- S3 panel lines -->
          <line x1="110" y1="40" x2="170" y2="40" stroke="#c4cad7" stroke-width="1" opacity="0.5"/>

          <!-- Stage 2 (instrument & upper stage) -->
          <rect x="108" y="70" width="64" height="55" rx="3" fill="#f0f2f5"/>
          <rect x="108" y="95" width="64" height="5" fill="#e07b39"/>
          <!-- S2 windows -->
          <circle cx="122" cy="97" r="5" fill="#2d3561" stroke="#c4cad7" stroke-width="2"/>
          <circle cx="122" cy="97" r="3" fill="#5fa8d0" opacity="0.5"/>
          <circle cx="158" cy="97" r="5" fill="#2d3561" stroke="#c4cad7" stroke-width="2"/>
          <circle cx="158" cy="97" r="3" fill="#5fa8d0" opacity="0.5"/>
          <!-- S2 markings -->
          <rect x="118" y="105" width="44" height="3" rx="1" fill="#e07b39" opacity="0.5"/>

          <!-- Stage 2 to Stage 3 separation ring -->
          <rect x="106" y="66" width="68" height="5" rx="2" fill="#d4d9e2"/>

          <!-- Stage 1 (core stage) -->
          <rect x="105" y="130" width="70" height="140" fill="#f0f2f5"/>
          <!-- S1 heat shield tiles on nose section -->
          <path d="M140 28 C168 28 190 52 190 90 L190 130 L105 130 L105 90 C105 52 112 28 140 28Z" fill="#e07b39"/>
          <path d="M140 28 C160 28 178 38 186 60 L186 130 L140 130Z" fill="rgba(0,0,0,0.08)"/>
          <!-- Nose tip -->
          <path d="M140 28 C168 28 190 52 190 90 L170 90 L170 28Z" fill="#e07b39"/>
          <path d="M140 28 C152 28 166 34 174 52 L174 90 L140 90Z" fill="rgba(255,255,255,0.15)"/>

          <!-- S1 panel lines -->
          <line x1="105" y1="160" x2="175" y2="160" stroke="#c4cad7" stroke-width="1.5" opacity="0.5"/>
          <line x1="105" y1="190" x2="175" y2="190" stroke="#c4cad7" stroke-width="1.5" opacity="0.5"/>
          <line x1="105" y1="220" x2="175" y2="220" stroke="#c4cad7" stroke-width="1.5" opacity="0.5"/>
          <line x1="105" y1="250" x2="175" y2="250" stroke="#c4cad7" stroke-width="1.5" opacity="0.5"/>
          <line x1="105" y1="280" x2="175" y2="280" stroke="#c4cad7" stroke-width="1.5" opacity="0.5"/>

          <!-- S1 stage markings -->
          <text x="140" y="178" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#6c7a89" font-weight="bold">SATURN V</text>
          <text x="140" y="208" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#333" font-weight="bold">USA</text>

          <!-- S1 to S2 separation ring -->
          <rect x="103" y="126" width="74" height="5" rx="2" fill="#d4d9e2"/>

          <!-- Fins (S-shaped grid fins) -->
          <path d="M108 240 L65 300 L65 310 L108 275Z" fill="#e07b39"/>
          <path d="M172 240 L215 300 L215 310 L172 275Z" fill="#e07b39"/>
          <!-- Fin details -->
          <line x1="68" y1="300" x2="106" y2="270" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
          <line x1="212" y1="300" x2="174" y2="270" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>

          <!-- S1 lower band -->
          <rect x="105" y="268" width="70" height="10" rx="1" fill="#e07b39"/>

          <!-- S1 to engine section ring -->
          <rect x="102" y="340" width="76" height="5" rx="2" fill="#c8cebc"/>

          <!-- Engine compartment details -->
          <rect x="108" y="340" width="64" height="10" rx="2" fill="#8c9aaa"/>
        </svg>
      </div>

      <!-- Google logo -->
      <div class="claude-logo" aria-label="Google logo">
        <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="#4285f4" opacity="0.7"/>
          <text x="16" y="22" text-anchor="middle" fill="#e0e7ff" font-size="18" font-weight="bold" font-family="system-ui">G</text>
        </svg>
      </div>

      <h1 class="title">ARGOCD DEMO</h1>

      <div class="console">
        <div><span class="label">&gt; MISSION STATUS:</span> <span class="ok">ALL SYSTEMS NOMINAL</span></div>
        <div><span class="label">&gt; DEPLOYMENTS SYNCED:</span>  <span class="val">4 / 4</span></div>
        <div><span class="label">&gt; CLUSTER:</span>            <span class="val">online</span></div>
        <div><span class="label">&gt; LAST DEPLOY:</span>         <span class="val">just now 🚀</span></div>
        <div><span class="label">&gt; </span><span class="cursor-blink">█</span></div>
      </div>
    </body>
    </html>
