apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-static
  namespace: argocddemo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ArgoCD Demo — Holiday Decor</title>
        <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }

          @keyframes snowFall {
            0% { transform: translateY(-20px) translateX(0px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) translateX(20px); opacity: 0; }
          }
          @keyframes treeSway {
            0%, 100% { transform: translateX(-3px); }
            50% { transform: translateX(3px); }
          }
          @keyframes ornamentGlow {
            0%, 100% { opacity: 0.6; filter: brightness(1); }
            50% { opacity: 1; filter: brightness(1.4); }
          }
          @keyframes starPulse {
            0%, 100% { filter: drop-shadow(0 0 6px #ffd700) drop-shadow(0 0 12px rgba(255,215,0,0.4)); opacity: 0.85; transform: scale(1); }
            50% { filter: drop-shadow(0 0 14px #ffd700) drop-shadow(0 0 28px rgba(255,215,0,0.6)); opacity: 1; transform: scale(1.08); }
          }

          body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(175deg, #0a1f16 0%, #132e20 35%, #1a4030 65%, #0d2818 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: relative;
          }

          .snowflake {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: snowFall linear infinite;
          }

          .tree-wrap {
            animation: treeSway 4s ease-in-out infinite;
            z-index: 1;
          }

          .ornament {
            animation: ornamentGlow 2.5s ease-in-out infinite;
          }
          .ornament.o1 { animation-delay: 0s; }
          .ornament.o2 { animation-delay: 0.4s; }
          .ornament.o3 { animation-delay: 0.8s; }
          .ornament.o4 { animation-delay: 1.2s; }
          .ornament.o5 { animation-delay: 1.6s; }

          .star-topper {
            transform-box: fill-box;
            transform-origin: center;
            animation: starPulse 2s ease-in-out infinite;
          }

          .garland-dot {
            animation: ornamentGlow 3s ease-in-out infinite alternate;
          }

          .title {
            color: #fff8e7;
            font-size: 2.6rem;
            margin-top: 8px;
            letter-spacing: 4px;
            text-shadow: 0 0 24px rgba(255,215,0,0.3), 0 0 60px rgba(255,215,0,0.15);
            z-index: 1;
          }

          .console {
            margin-top: 28px;
            padding: 20px 32px;
            background: rgba(5,15,8,0.85);
            border: 1px solid rgba(102,217,168,0.3);
            border-radius: 12px;
            color: #66d9a8;
            font-size: 0.92rem;
            line-height: 1.7;
            z-index: 1;
            box-shadow: 0 0 40px rgba(102,217,168,0.08), inset 0 0 20px rgba(102,217,168,0.03);
            max-width: 540px;
          }
          .console .label { color: #ffd700; }
          .console .ok    { color: #66d9a8; font-weight: bold; }
          .console .val   { color: #fff8e7; }
          .cursor-blink {
            animation: starPulse 1s step-end infinite;
            color: #66d9a8;
          }
        </style>
    </head>
    <body>

      <!-- Snowflakes -->
      <script>
        for(let i=0;i<50;i++){
          const s=document.createElement('div');
          s.className='snowflake';
          const size=2+Math.random()*3;
          s.style.cssText=`width:${size}px;height:${size}px;top:-10px;left:${Math.random()*100}%;animation-delay:${Math.random()*8}s;animation-duration:${4+Math.random()*6}s;opacity:${0.3+Math.random()*0.5}`;
          document.body.appendChild(s);
        }
      </script>

      <div class="tree-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="280" height="460" viewBox="0 0 220 380">
          <defs>
            <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffd700" stop-opacity="1"/>
              <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- Ground snow mound -->
          <ellipse cx="110" cy="358" rx="70" ry="14" fill="rgba(255,255,255,0.15)"/>

          <!-- Wooden stand -->
          <path d="M88 330 L92 350 L128 350 L132 330Z" fill="#6B3410"/>
          <rect x="85" y="348" width="50" height="6" rx="2" fill="#8B4513"/>

          <!-- Trunk -->
          <rect x="98" y="300" width="24" height="32" rx="3" fill="#8B4513"/>
          <rect x="100" y="302" width="4" height="28" rx="2" fill="rgba(255,255,255,0.06)"/>

          <!-- Bottom tier foliage -->
          <path d="M110 140 L50 290 L170 290Z" fill="#0d5e35"/>
