apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: argocddemo
data:
  default.conf: |
    # Upstream with keepalive connections to backend
    upstream backend_upstream {
        server backend.argocddemo.svc.cluster.local:8000;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Static content with aggressive caching
        location ~* \.(html)$ {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # API proxy with connection keepalive
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;

            # Buffering for smaller responses
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Health check with keepalive
        location /health {
            proxy_pass http://backend_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Hot-reload endpoint
        location /reload {
            proxy_pass http://backend_upstream/reload;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
        }

        # Prometheus metrics endpoint
        location /nginx_status {
            stub_status on;
            allow all;
        }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-app-config
  namespace: argocddemo
data:
  main.py: |
    """Demo backend using FastAPI."""

    import os
    import time

    from fastapi import FastAPI, Response
    from fastapi.responses import JSONResponse
    from prometheus_client import Counter, Histogram, generate_latest

    app = FastAPI(title="ArgoCD Demo Backend", version="0.1.0")

    _APP_MODULE_PATH = "/app/main.py"

    # --- Prometheus metrics (safe across hot-reload exec) ---

    try:
        http_requests_total = Counter(
            "http_requests_total",
            "Total HTTP requests",
            ["method", "endpoint", "status"],
        )
    except ValueError:
        http_requests_total = app.state.http_requests_total

    try:
        http_request_duration_seconds = Histogram(
            "http_request_duration_seconds",
            "HTTP request latency",
            ["method", "endpoint"],
        )
    except ValueError:
        http_request_duration_seconds = app.state.http_request_duration_seconds

    app.state.http_requests_total = http_requests_total
    app.state.http_request_duration_seconds = http_request_duration_seconds

    # --- Middleware: auto-instrument every request ---

    @app.middleware("http")
    async def metrics_middleware(request, call_next):
        start = time.time()
        response = await call_next(request)
        duration = time.time() - start
        endpoint = request.url.path
        http_requests_total.labels(
            method=request.method,
            endpoint=endpoint,
            status=response.status_code,
        ).inc()
        http_request_duration_seconds.labels(
            method=request.method,
            endpoint=endpoint,
        ).observe(duration)
        return response

    # --- /metrics endpoint ---

    @app.get("/metrics")
    async def metrics():
        """Prometheus metrics endpoint."""
        return Response(content=generate_latest(), media_type="text/plain; version=0.0.4")


    @app.get("/health")
    async def health() -> dict:
        """Health check endpoint."""
        return {"status": "healthy", "version": "0.1.0"}


    _ITEMS = [
        {"id": 1, "name": "Widget A"},
        {"id": 2, "name": "Widget B"},
        {"id": 3, "name": "Widget C"},
        {"id": 4, "name": "Widget D"},
        {"id": 5, "name": "Widget E"},
    ]


    @app.get("/api/items")
    async def get_items(response: Response) -> list[dict]:
        """Return a demo list of items."""
        response.headers["Cache-Control"] = "max-age=60, stale-while-revalidate=30"
        return _ITEMS


    @app.get("/")
    async def root() -> dict:
        """Root endpoint — simple greeting."""
        return {"message": "Hello from the ArgoCD demo backend!"}

    @app.post("/reload")
    async def reload_from_disk() -> dict:
        """Hot-reload app state from its ConfigMap volume mount.

        Reads /app/main.py from disk (mounted by ArgoCD), exec's the
        file against this module's globals, and updates any dynamic
        variables (e.g. _ITEMS) without a pod restart.
        """
        path = _APP_MODULE_PATH
        if not os.path.isfile(path):
            return {"ok": False, "error": f"file not found: {path}"}

        with open(path, "r") as f:
            source = f.read()

        ctx = {
            "_ITEMS": _ITEMS,
            "app": app,
            "__name__": "__main__",
            "__builtins__": __builtins__,
        }
        exec(source, ctx)  # noqa: S102  # safe — we control the mounted file

        if "_ITEMS" in ctx:
            _ITEMS.clear()
            _ITEMS.extend(ctx["_ITEMS"])

        return {"ok": True, "path": path, "loaded_items": len(_ITEMS)}

