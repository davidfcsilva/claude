          <circle class="garland-dot" cx="72" cy="235" r="2.5" fill="#ffd700" opacity="0.8"/>
          <circle class="garland-dot" cx="148" cy="245" r="2.5" fill="#ffd700" opacity="0.8"/>
          <circle class="garland-dot" cx="62" cy="265" r="2.5" fill="#ffd700" opacity="0.8"/>
          <circle class="garland-dot" cx="155" cy="275" r="2.5" fill="#ffd700" opacity="0.8"/>
          <circle class="garland-dot" cx="78" cy="285" r="2.5" fill="#ffd700" opacity="0.8"/>
          <circle class="garland-dot" cx="135" cy="260" r="2.5" fill="#ffd700" opacity="0.8"/>
          <circle class="garland-dot" cx="100" cy="195" r="2.5" fill="#ffd700" opacity="0.8"/>
          <circle class="garland-dot" cx="120" cy="230" r="2.5" fill="#ffd700" opacity="0.8"/>

          <!-- Red bauble ornaments (6) -->
          <circle class="ornament o1" cx="90" cy="160" r="8" fill="#c41e3a"/>
          <circle cx="88" cy="157" r="2" fill="rgba(255,255,255,0.5)"/>
          <circle class="ornament o2" cx="135" cy="195" r="8" fill="#c41e3a"/>
          <circle cx="133" cy="192" r="2" fill="rgba(255,255,255,0.5)"/>
          <circle class="ornament o3" cx="72" cy="230" r="8" fill="#c41e3a"/>
          <circle cx="70" cy="227" r="2" fill="rgba(255,255,255,0.5)"/>
          <circle class="ornament o4" cx="148" cy="260" r="8" fill="#c41e3a"/>
          <circle cx="146" cy="257" r="2" fill="rgba(255,255,255,0.5)"/>
          <circle class="ornament o5" cx="85" cy="275" r="8" fill="#c41e3a"/>
          <circle cx="83" cy="272" r="2" fill="rgba(255,255,255,0.5)"/>
          <circle class="ornament o1" cx="120" cy="285" r="8" fill="#c41e3a"/>
          <circle cx="118" cy="282" r="2" fill="rgba(255,255,255,0.5)"/>

          <!-- Gold bauble ornaments (5) -->
          <circle class="ornament o2" cx="108" cy="130" r="8" fill="#ffd700"/>
          <circle cx="106" cy="127" r="2" fill="rgba(255,255,255,0.5)"/>
